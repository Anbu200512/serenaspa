<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Login — SereneSpa</title>
  <meta name="description" content="Sign in to your SereneSpa account to reach your bookings, memberships and receipts — or continue with Google, Facebook or Apple." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("serenespa_theme");
        if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "dark") document.documentElement.classList.add("dark");
        if (localStorage.getItem("serenespa_direction") === "rtl") document.documentElement.dir = "rtl";
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-cream-50 dark:bg-forest-900 text-forest-800 dark:text-sage-100 antialiased">

  <div class="fixed top-4 end-4 z-50 flex items-center gap-2">
    <button type="button" id="dir-toggle" title="Switch text direction" aria-label="Switch text direction" class="grid place-items-center w-10 h-10 rounded-xl border border-sage-200 dark:border-sage-700 bg-white/85 dark:bg-forest-800/85 backdrop-blur text-sage-600 dark:text-sage-300 shadow-soft transition-colors hover:bg-sage-100 dark:hover:bg-sage-700">
      <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
    </button>
    <button type="button" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode" class="grid place-items-center w-10 h-10 rounded-xl border border-sage-200 dark:border-sage-700 bg-white/85 dark:bg-forest-800/85 backdrop-blur text-sage-600 dark:text-sage-300 shadow-soft transition-colors hover:bg-sage-100 dark:hover:bg-sage-700">
      <i data-lucide="sun" class="w-4 h-4"></i>
    </button>
  </div>
  <script>
    (function () {
      var dark = document.documentElement.classList.contains("dark");
      var ic = document.querySelector("#theme-toggle [data-lucide]");
      if (ic) ic.setAttribute("data-lucide", dark ? "moon" : "sun");
    })();
  </script>

  <main>
    <section class="hero-gradient pt-16 sm:pt-24 pb-16 sm:pb-24">
      <div class="mx-auto max-w-6xl px-4 sm:px-6">
        <div class="reveal grid overflow-hidden rounded-[2rem] border border-sage-100 bg-white shadow-lift dark:border-sage-700/60 dark:bg-forest-800 lg:grid-cols-2">

          <div class="flex items-center p-6 sm:p-10 lg:order-2 lg:p-12">
            <div class="mx-auto w-full max-w-md">
              <span class="inline-flex items-center gap-2 rounded-full border border-gold-400/50 bg-cream-100 px-4 py-1.5 text-xs font-medium text-gold-600 dark:bg-forest-900 dark:text-gold-300">
                <i data-lucide="flower-2" class="h-3.5 w-3.5"></i>Welcome back
              </span>
              <h1 class="mt-5 font-display text-3xl font-semibold text-forest-700 text-balance dark:text-cream-100 sm:text-4xl">Sign in to your quiet corner</h1>
              <p class="mt-3 text-sm leading-relaxed text-sage-600 dark:text-sage-300">Your bookings, memberships and receipts are waiting in the dashboard.</p>

              <form id="login-form" class="mt-7 space-y-4">
                <div>
                  <label for="login-id" class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-sage-500 dark:text-sage-400">Email or mobile number</label>
                  <input id="login-id" name="identifier" type="text" required autocomplete="username" placeholder="Email or mobile number" class="w-full rounded-xl border border-sage-200 bg-white px-4 py-3 text-sm text-forest-800 placeholder:text-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-400 dark:border-sage-600 dark:bg-forest-900 dark:text-sage-100" />
                </div>

                <div>
                  <label for="login-password" class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-sage-500 dark:text-sage-400">Password</label>
                  <div class="relative">
                    <input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password" class="w-full rounded-xl border border-sage-200 bg-white px-4 py-3 pe-12 text-sm text-forest-800 placeholder:text-sage-400 focus:outline-none focus:ring-2 focus:ring-sage-400 dark:border-sage-600 dark:bg-forest-900 dark:text-sage-100" />
                    <button type="button" id="login-pw-toggle" aria-label="Show password" class="absolute inset-y-0 end-0 flex items-center pe-3.5 text-sage-500 transition-colors hover:text-forest-700 dark:hover:text-gold-300">
                      <i data-lucide="eye" class="h-5 w-5"></i>
                    </button>
                  </div>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-2">
                  <label for="login-remember" class="flex cursor-pointer items-center gap-2 text-sm text-sage-600 dark:text-sage-300">
                    <input id="login-remember" type="checkbox" class="h-4 w-4 rounded border border-sage-300 accent-forest-700 focus:ring-sage-400" />
                    Remember me
                  </label>
                  <button type="button" id="forgot-btn" class="text-sm font-medium text-forest-700 transition-colors hover:text-gold-600 dark:text-gold-300 dark:hover:text-gold-400">Forgot password?</button>
                </div>

                <p id="login-error" role="alert" class="hidden text-sm font-medium text-red-600 dark:text-red-400"></p>

                <button type="submit" id="login-submit" class="inline-flex w-full items-center justify-center gap-2 rounded-full bg-forest-700 px-6 py-3.5 text-sm font-medium text-cream-50 shadow-soft transition-colors hover:bg-forest-600 dark:bg-gold-500 dark:text-forest-900 dark:hover:bg-gold-400">
                  <i data-lucide="log-in" class="h-4 w-4"></i>Sign in
                </button>

                <div class="flex items-center gap-3 pt-1">
                  <span class="h-px flex-1 bg-sage-200 dark:bg-sage-700"></span>
                  <span class="text-xs font-semibold uppercase tracking-wider text-sage-500 dark:text-sage-400">Or continue with</span>
                  <span class="h-px flex-1 bg-sage-200 dark:bg-sage-700"></span>
                </div>

                <div class="grid grid-cols-3 gap-3">
                  <button type="button" data-social="google" aria-label="Continue with Google" class="inline-flex items-center justify-center rounded-full border border-sage-200 bg-white px-4 py-3 transition-colors hover:bg-sage-50 dark:border-sage-600 dark:bg-forest-900 dark:hover:bg-forest-700/50">
                    <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true">
                      <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.54 5.54 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.54-5.17 3.54-8.87z" />
                      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3a7.2 7.2 0 0 1-10.7-3.78H1.4v3.09A12 12 0 0 0 12 24z" />
                      <path fill="#FBBC05" d="M5.35 14.31a7.2 7.2 0 0 1 0-4.62V6.6H1.4a12 12 0 0 0 0 10.8l3.95-3.09z" />
                      <path fill="#EA4335" d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.4 6.6l3.95 3.09A7.2 7.2 0 0 1 12 4.77z" />
                    </svg>
                  </button>
                  <button type="button" data-social="facebook" aria-label="Continue with Facebook" class="inline-flex items-center justify-center rounded-full border border-sage-200 bg-white px-4 py-3 transition-colors hover:bg-sage-50 dark:border-sage-600 dark:bg-forest-900 dark:hover:bg-forest-700/50">
                    <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true">
                      <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z" />
                    </svg>
                  </button>
                  <button type="button" data-social="apple" aria-label="Continue with Apple" class="inline-flex items-center justify-center rounded-full border border-sage-200 bg-white px-4 py-3 text-forest-900 transition-colors hover:bg-sage-50 dark:border-sage-600 dark:bg-forest-900 dark:text-cream-100 dark:hover:bg-forest-700/50">
                    <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true">
                      <path fill="currentColor" d="M16.37 12.79c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.19-1.72-1.36-.14-2.65.8-3.34.8-.69 0-1.75-.78-2.88-.76-1.48.02-2.85.86-3.61 2.18-1.54 2.67-.39 6.62 1.11 8.79.73 1.06 1.61 2.26 2.76 2.22 1.11-.05 1.53-.72 2.87-.72 1.34 0 1.72.72 2.89.69 1.19-.02 1.95-1.09 2.68-2.16.84-1.24 1.19-2.44 1.21-2.5-.03-.01-2.32-.89-2.34-3.53zM14.2 6.13c.61-.74 1.02-1.77.91-2.79-.88.04-1.94.59-2.57 1.32-.56.65-1.06 1.69-.93 2.69.98.08 1.98-.5 2.59-1.22z" />
                    </svg>
                  </button>
                </div>

                <div class="flex items-center gap-3 pt-1">
                  <span class="h-px flex-1 bg-sage-200 dark:bg-sage-700"></span>
                  <span class="text-xs font-semibold uppercase tracking-wider text-sage-500 dark:text-sage-400">New to SereneSpa?</span>
                  <span class="h-px flex-1 bg-sage-200 dark:bg-sage-700"></span>
                </div>

                <a href="signup.html" class="inline-flex w-full items-center justify-center gap-2 rounded-full border border-sage-300 px-6 py-3 text-sm font-medium text-forest-700 transition-colors hover:bg-sage-50 dark:border-sage-600 dark:text-sage-100 dark:hover:bg-forest-900">
                  Create an account<i data-lucide="arrow-right" class="h-4 w-4"></i>
                </a>
              </form>
            </div>
          </div>

          <div class="relative order-first h-64 overflow-hidden bg-forest-900 sm:h-80 lg:order-1 lg:h-auto">
            <img src="https://images.pexels.com/photos/38407788/pexels-photo-38407788.jpeg?auto=compress&cs=tinysrgb&w=1200" alt="Soothing massage session in a serene spa environment" class="absolute inset-0 h-full w-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-forest-900/90 via-forest-900/45 to-forest-900/10"></div>
            <div class="absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-forest-900/60 to-transparent"></div>
            <a href="index.html" class="absolute inset-x-0 top-0 flex items-center gap-2.5 p-5 sm:p-7 lg:p-9">
              <span class="grid place-items-center w-9 h-9 shrink-0 rounded-xl bg-forest-700 dark:bg-gold-500 text-cream-50 dark:text-forest-900 shadow-soft"><i data-lucide="leaf" class="w-5 h-5"></i></span>
              <span class="font-display text-xl font-semibold text-cream-50">SereneSpa</span>
            </a>
            <blockquote class="absolute inset-x-0 bottom-0 p-5 sm:p-7 lg:p-9">
              <p class="font-display text-lg italic leading-snug text-cream-50 sm:text-2xl lg:text-3xl">An hour of slow hands and warm oil — and the whole week exhales.</p>
              <cite class="mt-2 block text-xs not-italic text-sage-300 sm:text-sm">The SereneSpa philosophy</cite>
            </blockquote>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@1.53.0/dist/umd/lucide.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
