<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — SereneSpa</title>
  <meta name="description" content="This path leads to our quiet garden — which, as far as we know, doesn't exist. Head back home or explore the SereneSpa treatment menu." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("serenespa_theme");
        if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "dark") document.documentElement.classList.add("dark");
        if (localStorage.getItem("serenespa_direction") === "rtl") document.documentElement.dir = "rtl";
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-cream-50 dark:bg-forest-900 text-forest-800 dark:text-sage-100 antialiased">

  <main>
    <section class="hero-gradient pt-16 sm:pt-24 pb-16 sm:pb-24">
      <div class="mx-auto max-w-2xl px-4 sm:px-6 text-center">
        <div class="reveal">
          <span class="inline-flex items-center gap-2 rounded-full border border-gold-400/50 bg-white/70 px-4 py-1.5 text-xs font-medium text-gold-600 dark:bg-forest-800/70 dark:text-gold-300">
            <i data-lucide="compass" class="h-3.5 w-3.5"></i>Page not found
          </span>
          <p class="mt-6 font-display text-7xl font-semibold text-gold-500/70 sm:text-8xl">404</p>
          <h1 class="mt-3 font-display text-2xl font-semibold text-forest-700 text-balance dark:text-cream-100 sm:text-3xl lg:text-4xl">This path leads to our quiet garden — which, as far as we know, doesn't exist.</h1>
          <p class="mx-auto mt-4 max-w-lg text-sm leading-relaxed text-sage-600 dark:text-sage-300 sm:text-base">The link may be mistyped, or the page has moved to another room. The treatment menu, however, is very much real — or simply return home and start again.</p>
          <div class="mt-7 flex flex-wrap justify-center gap-3">
            <a href="index.html" class="inline-flex items-center gap-2 rounded-full bg-forest-700 px-7 py-3.5 text-sm font-medium text-cream-50 shadow-soft transition-colors hover:bg-forest-600 dark:bg-gold-500 dark:text-forest-900 dark:hover:bg-gold-400">
              <i data-lucide="home" class="h-4 w-4"></i>Back to Home
            </a>
            <a href="treatments.html" class="inline-flex items-center gap-2 rounded-full border border-sage-300 px-7 py-3.5 text-sm font-medium text-forest-700 transition-colors hover:bg-white dark:border-sage-600 dark:text-sage-100 dark:hover:bg-forest-800">
              Explore Treatments<i data-lucide="arrow-right" class="h-4 w-4"></i>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@1.53.0/dist/umd/lucide.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
